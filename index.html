<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F4F6FD">
<meta name="apple-mobile-web-app-title" content="Chewtopia">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Chewtopia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6FD; --card:#FFF; --ink:#16222E; --soft:#6A7E8F; --line:#E1EAF2;
    --blue:#2F73E8; --lime:#4FB86B; --coral:#FF6F52; --grape:#7C5CE0; --sun:#FFB627;
    --sky:#E8F2FE;
    --tang:#C25A0C; --peach:#FFE9D2;   /* SC */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:'Lexend',system-ui,-apple-system,sans-serif;
    font-size:17px;line-height:1.5;color:var(--ink);background:var(--bg);
    display:flex;justify-content:center;
    padding:16px calc(13px + env(safe-area-inset-right)) calc(34px + env(safe-area-inset-bottom))
            calc(13px + env(safe-area-inset-left));
  }
  .shell{width:100%;max-width:760px;position:relative;z-index:1}
  .warn{background:#FFF4E4;color:#8A6100;border-radius:12px;padding:11px 13px;
    font-size:14px;font-weight:600;margin:0 0 12px}
  @media(min-width:900px){ .shell{max-width:900px} }

  .mark{font-family:'Baloo 2',cursive;font-weight:800;font-size:clamp(28px,7vw,36px);
    line-height:1;background:none;border:none;padding:0;cursor:pointer;
    letter-spacing:-.02em;display:block;margin-bottom:14px}
  .mark span:nth-child(5n+1){color:var(--blue)}
  .mark span:nth-child(5n+2){color:var(--lime)}
  .mark span:nth-child(5n+3){color:var(--coral)}
  .mark span:nth-child(5n+4){color:var(--grape)}
  .mark span:nth-child(5n+5){color:var(--sun)}

  .pick{display:flex;gap:9px;margin-bottom:14px}
  .pk{flex:1;border:2px solid var(--line);background:var(--card);color:var(--soft);
    border-radius:14px;padding:10px 8px;font-family:inherit;font-size:15px;font-weight:700;
    cursor:pointer;box-shadow:0 2px 0 var(--line);line-height:1.2}
  .pk small{display:block;font-size:11px;font-weight:500;opacity:.8}
  .pk.on{color:#fff;background:var(--ink);border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
  .pk.k-tc.on{background:var(--blue);border-color:var(--blue);box-shadow:0 3px 0 var(--blue)}
  .pk.k-sc.on{background:var(--tang);border-color:var(--tang);box-shadow:0 3px 0 var(--tang)}

  .tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:none;border-radius:14px;padding:11px 16px;font-family:inherit;
    font-size:15px;font-weight:800;cursor:pointer;white-space:nowrap;min-height:44px;
    transition:transform .1s,box-shadow .1s}
  @media(min-width:620px){ .tab{flex:1 1 0;padding:11px 6px} }
  .tab:active{transform:translateY(2px)}
  /* resting: a wash of its own colour. chosen: filled, with a white ring. */
  .tab.on{color:#fff;box-shadow:0 0 0 3px #fff, 0 4px 0 rgba(16,24,40,.22)}
  .t-blue {background:#E4EEFD;color:#2559B8}
  .t-blue.on {background:linear-gradient(150deg,#2F73E8,#5A9BF7)}
  .t-grape{background:#EEE9FD;color:#5B41B8}
  .t-grape.on{background:linear-gradient(150deg,#7C5CE0,#A38BF0)}
  .t-coral{background:#FFE7E1;color:#C2472C}
  .t-coral.on{background:linear-gradient(150deg,#FF6F52,#FF9478)}
  .t-lime {background:#DFF3E4;color:#2F7A45}
  .t-lime.on {background:linear-gradient(150deg,#4FB86B,#79D191)}
  .t-sun  {background:#FFF0D2;color:#8A6100}
  .t-sun.on  {background:linear-gradient(150deg,#E9A00C,#FFC24D)}
  .t-teal {background:#DFF1F4;color:#1F6E7C}
  .t-teal.on {background:linear-gradient(150deg,#1F8FA3,#4FC0D2)}
  .tabdiv{flex:0 0 auto;width:2px;background:rgba(255,255,255,.5);border-radius:2px;margin:7px 3px}
  .tabdiv{flex:0 0 auto;width:2px;background:var(--line);border-radius:2px;margin:7px 3px}

  .panel{background:var(--card);border:2px solid var(--line);border-radius:18px;
    padding:18px 16px;margin-bottom:14px}
  h2{font-family:'Baloo 2',cursive;font-size:23px;margin:0 0 12px;
     display:flex;align-items:center;gap:9px}
  h2 .em{font-size:21px}
  h2 .side{margin-left:auto;font-family:'Lexend',sans-serif;font-size:13px;
    font-weight:600;color:var(--soft)}
  .empty{color:var(--soft);font-size:15px;padding:4px 0}
  .hidden{display:none!important}

  /* ---- coming up ---- */
  .ev{display:flex;gap:13px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
  .ev:last-of-type{border-bottom:0}
  .ev .cd{background:var(--sky);border-radius:12px;padding:8px 10px;text-align:center;min-width:58px}
  .ev .cd b{display:block;font-family:'Baloo 2',cursive;font-size:19px;line-height:1.05;color:var(--blue)}
  .ev .cd i{font-style:normal;font-size:11px;text-transform:uppercase;color:var(--soft);font-weight:700}
  .ev.soon .cd{background:#FFEDE8} .ev.soon .cd b{color:var(--coral)}
  .ev .tx{flex:1;font-weight:600}
  .ev .tx small{display:block;font-weight:400;color:var(--soft);font-size:13px;margin-top:1px}
  .ev .wh{font-weight:800;color:var(--ink);margin-right:8px}
  .ev.soon .wh{color:var(--coral)}
  .ev .nt{display:block;font-weight:400;color:var(--ink);font-size:14px;line-height:1.45;
    margin-top:7px;padding:9px 11px;background:var(--bg);border-radius:10px}
  .ev .x{align-self:flex-start}
  .prac{display:inline-block;margin-top:8px;border:none;border-radius:10px;
    padding:8px 14px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer}
  .prac:active{transform:scale(.97)}

  /* ---- review card and weak list ---- */
  .test.rev{background:linear-gradient(135deg,#FFF4E4,#FFE9D2);border-color:#F3C99B}
  .weak{margin:10px 0 2px;padding:11px 13px;background:#FFF4E4;border-radius:12px}
  .weak .wt{font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    font-weight:700;color:#8A6100;margin-bottom:7px}
  .wi{display:inline-block;background:#fff;border-radius:9px;padding:5px 10px;
    margin:0 6px 6px 0;font-size:14px;font-weight:700;color:var(--ink)}
  .wi i{font-style:normal;font-weight:500;color:var(--coral);margin-left:6px;font-size:12px}

  /* ---- reading ---- */
  .rdsum{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .rdc{font-size:13px;font-weight:800;border-radius:9px;padding:5px 11px}
  .rdc.en{background:var(--sky);color:var(--blue)}
  .rdc.cn{background:#FFE9D2;color:var(--tang)}
  .rdc.mo{background:#DFF3E4;color:#2F7A45}
  .bk{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
  .bk:last-of-type{border-bottom:none}
  .bl{flex:0 0 auto;font-size:12px;font-weight:800;border-radius:8px;padding:5px 8px}
  .bl.en{background:var(--sky);color:var(--blue)}
  .bl.cn{background:#FFE9D2;color:var(--tang)}
  .btx{flex:1;font-weight:700;font-size:16px}
  .btx small{display:block;font-weight:400;font-size:13px;color:var(--soft);margin-top:1px}
  .ev .x{background:none;border:none;color:#B9C7D4;font-size:22px;cursor:pointer;
    padding:10px 12px;min-width:44px;min-height:44px}

  /* ---- day rows ---- */
  .day{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center;
    padding:8px 0;border-bottom:1px solid var(--line)}
  .day:last-of-type{border-bottom:0}
  .day .d{font-weight:700;font-size:14px;color:var(--soft)}
  .day.now .d{color:var(--coral)}
  .day.now{background:#FFF8F6;margin:0 -8px;padding:8px;border-radius:10px;border-bottom:0}
  .cell{width:100%;border:none;background:none;font-family:inherit;font-size:16px;
    color:var(--ink);padding:6px 8px;border-radius:9px;resize:none;line-height:1.5}
  .cell::placeholder{color:#B9C7D4}
  .cell:focus{outline:none;background:var(--sky)}
  textarea.cell{min-height:34px;overflow:hidden}

  /* ---- meals: one day per block, full width ---- */
  .mealday{padding:12px 0;border-bottom:1px solid var(--line)}
  .ml{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);
    font-weight:700;margin:6px 0 2px}
  .mcols{display:grid;grid-template-columns:1fr;gap:0}
  @media(min-width:620px){ .mcols{grid-template-columns:1fr 1.4fr;gap:12px;align-items:start} }
  .mcol .ml{margin-top:6px}
  @media(min-width:620px){ .mcol .ml{margin-top:2px} }
  .fd{margin:0 0 10px;font-size:15px;line-height:1.5}
  .fd:last-child{margin-bottom:0}
  .cell.brek{background:var(--sky);padding:9px 11px}
  .cell.dinr{background:#E7F4EA;padding:9px 11px}
  .mcol.b .ml{color:var(--blue)}
  .mcol.d .ml{color:#2F7A45}
  .mealday:last-of-type{border-bottom:0}
  .mealday .mh{font-family:'Baloo 2',cursive;font-size:18px;margin-bottom:2px}
  .mealday .mh em{font-style:normal;font-size:13px;font-weight:400;
    font-family:'Lexend',sans-serif;color:var(--soft);margin-left:5px}
  .mealday.now{background:#FFF8F6;margin:0 -10px;padding:12px 10px;border-radius:12px;border-bottom:0}
  .mealday.now .mh{color:var(--coral)}
  .mealday .cell{padding:4px 0}

  /* ---- buttons ---- */
  .btn{border:none;border-radius:14px;padding:13px 18px;font-family:'Baloo 2',cursive;
    font-weight:700;font-size:17px;cursor:pointer}
  .btn:active{transform:translateY(2px)}
  .btn.wide{width:100%}
  .btn.go{background:var(--lime);color:#fff}
  .btn.play{background:var(--coral);color:#fff}
  .btn.soft{background:var(--sky);color:var(--blue)}
  .btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
  .btnrow{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
  .btnrow .btn{flex:1;min-width:130px}
  .addlink{background:none;border:none;color:var(--blue);font-family:inherit;
    font-size:15px;font-weight:700;cursor:pointer;padding:14px 0 6px;min-height:44px}

  input,textarea,select{width:100%;border:2px solid var(--line);border-radius:12px;
    padding:12px;font-family:inherit;font-size:16px;color:var(--ink);background:#fff}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue)}
  .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);
    font-weight:700;margin:12px 0 5px}
  .saved{font-size:13px;color:var(--lime);font-weight:700;height:16px;margin-top:8px}

  /* ---- tests ---- */
  .test{display:flex;align-items:center;justify-content:space-between;gap:11px;width:100%;
    background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:14px 15px;
    margin-bottom:9px;font-family:inherit;cursor:pointer;text-align:left;color:var(--ink)}
  .test .nm{font-weight:700;font-size:16px}
  .test .mt{display:block;font-size:13px;color:var(--soft);margin-top:2px}
  .pill{font-size:14px;font-weight:700;border-radius:999px;padding:5px 12px;
    background:var(--line);color:var(--soft);white-space:nowrap}
  .pill.good{background:#DFF3E4;color:#2F7A45}
  .pill.mid{background:#FFF1D6;color:#8A6100}
  .pill.low{background:#FFE3DC;color:#B03A22}
  .pill.beat{background:var(--sky);color:var(--blue);font-size:12px;padding:5px 9px}
  .pills{display:flex;gap:5px;align-items:center;flex-shrink:0}

  /* ---- day streak ---- */
  .strk{display:inline-block;font-size:13px;font-weight:800;border-radius:999px;
    padding:4px 10px;margin-right:8px;background:#FFEDE8;color:var(--coral)}
  .strk.cold{background:var(--bg);color:var(--soft)}
  .sub{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);
    font-weight:700;margin:16px 0 8px}
  .sub:first-of-type{margin-top:0}

  /* ---- child colours ---- */
  .c-tc{background:var(--sky)!important;color:var(--blue)!important}
  .c-sc{background:var(--peach)!important;color:var(--tang)!important}
  .c-all{background:#DFF3E4!important;color:#2F7A45!important}
  .c-tc b,.c-sc b,.c-all b{color:inherit!important}
  .tag{display:inline-block;font-size:14px;font-weight:800;border-radius:8px;
    padding:3px 10px;margin-right:8px;letter-spacing:.03em;vertical-align:1px}
  .dot{display:inline-block;width:11px;height:11px;border-radius:4px;
    vertical-align:-1px;margin-right:3px}

  /* ---- week grid ---- */
  .wknav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .wknav .btn{padding:10px 18px;font-size:19px;line-height:1;min-height:44px}
  .wkrange{font-weight:700;font-size:14px;color:var(--soft)}
  .wkwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px 6px}
  .wkgrid{display:grid;grid-template-columns:40px repeat(7,minmax(60px,1fr));
    gap:2px;min-width:500px;position:relative}
  @media(min-width:700px){ .wkgrid{grid-template-columns:46px repeat(7,minmax(74px,1fr))} }
  .wkh{font-size:12.5px;font-weight:700;color:var(--soft);text-align:center;
    align-self:center;letter-spacing:.03em}
  .wkh em{font-style:normal;font-weight:400;opacity:.75}
  .wkh.now{color:var(--coral)}
  .corner{grid-column:1;grid-row:1}
  .wkt{grid-column:1;font-size:10px;color:var(--soft);text-align:right;
    padding-right:5px;align-self:start;line-height:1;padding-top:1px}
  .wkrule{grid-column:2/-1;border-top:1px solid var(--line);height:0;align-self:start;
    pointer-events:none}
  .wkb{border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:700;text-align:center;padding:1px 3px;line-height:1.1;
    overflow:hidden;cursor:default;writing-mode:horizontal-tb}
  .wkb.sch{font-size:11px}
  /* both children on one grid: half a column each */
  .wkb.hL{width:calc(50% - 1px);justify-self:start}
  .wkb.hR{width:calc(50% - 1px);justify-self:end}
  /* in both mode, school blocks carry the child's colour on their edge too */
  .wkb.sch.hL{box-shadow:inset 0 -3px 0 rgba(47,115,232,.55)}
  .wkb.sch.hR{box-shadow:inset 0 -3px 0 rgba(194,90,12,.55)}
  /* school subjects */
  .s-core{background:var(--sky);color:var(--blue)}
  .s-cl{background:#FFE3DC;color:#B03A22}
  .s-rec{background:#FFF1D6;color:#8A6100}
  .s-fun{background:#DFF3E4;color:#2F7A45}
  .s-other{background:#F0EAFE;color:var(--grape)}
  /* after-school blocks: child colour plus a solid edge */
  .wkb.own{cursor:pointer;box-shadow:inset 0 -3px 0 currentColor;font-weight:800}
  .wkallday-label{grid-column:1;font-size:10px;color:var(--soft);text-align:right;
    padding-right:5px;align-self:center;line-height:1.1}
  .wkallday{display:flex;flex-wrap:wrap;gap:2px;align-content:center;padding:2px 0}
  .wkallday .chip{font-size:11px;font-weight:700;border-radius:6px;padding:3px 6px;
    width:100%;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .key{font-size:13px;color:var(--soft);line-height:1.9;margin-top:14px}
  .legend{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 13px}
  .lg{font-size:14px;font-weight:800;border-radius:9px;padding:6px 13px;
    border:2px solid transparent;font-family:inherit;cursor:pointer;opacity:.55}
  .lg.on{opacity:1;border-color:currentColor}

  /* ---- quiz ---- */
  .qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px}
  .qtop .sc{font-size:14px;color:var(--soft);font-weight:700}
  .meter{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:16px}
  .meter i{display:block;height:100%;background:var(--lime);border-radius:999px;transition:width .25s}
  .kind{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--coral);font-weight:700}
  .qq{font-family:'Baloo 2',cursive;font-size:clamp(23px,5.5vw,29px);margin:6px 0 4px}
  .hz{font-family:'Noto Sans SC',serif;font-size:clamp(66px,17vw,100px);font-weight:700;
    text-align:center;line-height:1.05;margin:10px 0 2px}
  .hz.q{color:var(--line)}
  .ctx{text-align:center;font-size:16px;color:var(--soft);margin-bottom:10px}
  .tip{font-size:14px;color:var(--soft);margin-bottom:14px}
  .fb{margin-top:14px;padding:14px;border-radius:14px;font-weight:600;font-size:16px;line-height:1.7}
  .fb.ok{background:#DFF3E4;color:#2A6B3D}
  .fb.no{background:#FFE3DC;color:#9C3319}
  .fb .big{font-family:'Baloo 2',cursive;font-size:21px;display:block;margin-bottom:3px}
  .lts{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .lt{min-width:28px;padding:7px 4px;border-radius:8px;font-weight:700;font-size:18px;
    background:var(--line);color:var(--ink);text-align:center}
  .lt.h{background:#7FD394;color:#12401F}
  .lt.s{background:#FF9A82;color:#5E1B0B}
  .pair{display:flex;gap:10px;margin-top:12px}
  .pair .f1{flex:2} .pair .f2{flex:1;min-width:92px}
  .done{text-align:center}
  .done .big{font-family:'Baloo 2',cursive;font-size:56px;margin:8px 0 0;color:var(--lime)}
  .done .st{font-size:27px;letter-spacing:.08em;margin:2px 0 4px}
  .done .rk{font-family:'Baloo 2',cursive;font-size:21px;margin:0 0 8px}
  .done .again{font-size:15px;line-height:1.8;margin-top:10px}
  .done .again b{color:var(--coral)}

  /* ---- 我会写 ---- */
  .big-word{font-family:'Noto Sans SC',serif;font-size:clamp(30px,8vw,42px);
    font-weight:700;color:var(--ink);letter-spacing:.06em;margin-bottom:2px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  @media(min-width:520px){ .opts{grid-template-columns:repeat(4,1fr)} }
  .opt{font-family:'Noto Sans SC',serif;font-size:clamp(38px,10vw,52px);font-weight:700;
    background:var(--bg);border:2px solid var(--line);border-radius:16px;
    padding:14px 6px;cursor:pointer;color:var(--ink);min-height:78px;transition:.08s}
  .opt:active{transform:translateY(2px)}
  .opt.sel{border-color:var(--blue);background:var(--sky);color:var(--blue)}
  .hzin{font-family:'Noto Sans SC',serif;font-size:40px;text-align:center;
    margin-top:14px;padding:14px;letter-spacing:.1em}
  .switch{text-align:center}
  .switch .addlink{font-size:14px}

  /* ---- quiz extras ---- */
  .bot{display:block;width:104px;margin:2px auto 8px;transform-origin:50% 92%;
    animation:bob 3s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .bot.cheer{animation:cheer .65s ease}
  @keyframes cheer{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-26px) scale(1.07)}
    60%{transform:translateY(0) scale(.95)}100%{transform:translateY(0) scale(1)}}
  .bot.oops{animation:oops .5s ease}
  @keyframes oops{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
  .bot .eye{animation:blink 4.5s infinite;transform-origin:center}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .hudchips{display:flex;gap:7px}
  .hud{font-size:14px;font-weight:800;border-radius:999px;padding:6px 12px;
    background:var(--bg);border:2px solid var(--line)}
  .hud.fire.hot{background:#FFEDE8;border-color:#FFC9BB;color:var(--coral)}
  .track{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
  .dot2{width:11px;height:11px;border-radius:4px;background:var(--line)}
  .dot2.now{background:var(--sun);transform:scale(1.25)}
  .dot2.win{background:var(--lime)}
  .dot2.lose{background:var(--coral)}
  .spark{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:60}
  .rankbadge{display:inline-block;font-family:'Baloo 2',cursive;font-size:17px;
    border-radius:999px;padding:5px 16px;margin-bottom:6px}
  .rankbadge.rS{background:#FFF1D6;color:#8A6100}
  .rankbadge.rA{background:#DFF3E4;color:#2F7A45}
  .rankbadge.rB{background:var(--sky);color:var(--blue)}
  .rankbadge.rC{background:#F0EAFE;color:var(--grape)}
  .rankbadge.rD{background:#FFE3DC;color:#B03A22}
  .streakline{font-size:14px;color:var(--soft);font-weight:600}

  /* ---- results ---- */
  .res{padding:12px 0;border-bottom:1px solid var(--line)}
  .res:last-of-type{border-bottom:0}
  .res .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .res .n{font-weight:700;font-size:16px}
  .res .best{margin-left:auto;font-size:13px;color:var(--soft)}
  .rl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .run{display:inline-flex;flex-direction:column;align-items:center;border-radius:11px;
    padding:8px 12px;min-width:62px}
  .run b{font-size:17px;font-weight:800;line-height:1.1}
  .run i{font-style:normal;font-size:11px;opacity:.8}
  .run.good{background:#DFF3E4;color:#2F7A45}
  .run.mid{background:#FFF1D6;color:#8A6100}
  .run.low{background:#FFE3DC;color:#B03A22}
  .arw{color:#C3D2DF;font-size:15px}

  /* ---- upcoming: date on the left, a column per boy ---- */
  .agenda{display:grid;grid-template-columns:56px 1fr 1fr;column-gap:8px;row-gap:2px;
    align-items:start}
  .agenda.solo{grid-template-columns:56px 1fr}
  .agh{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;
    text-align:center;border-radius:9px;padding:5px 4px;margin-bottom:4px}
  .agmon{grid-column:1/-1;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    font-weight:800;color:var(--soft);border-bottom:1px solid var(--line);
    padding:0 0 4px;margin:12px 0 6px}
  .agd{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    background:var(--bg);border-radius:12px;padding:7px 4px 6px;line-height:1.05}
  .agd b{font-size:20px;font-weight:800}
  .agd i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--soft);
    text-transform:uppercase;letter-spacing:.04em}
  .agd.now{background:var(--ink);color:#fff}
  .agd.now i{color:rgba(255,255,255,.8)}
  .agd.sp{background:transparent}
  .agc{min-height:6px;padding-bottom:6px}
  .agc.both{grid-column:2/-1}
  .evc{position:relative;background:var(--bg);border-radius:12px;padding:10px 30px 10px 12px;
    margin-bottom:6px}
  .evc.e-tc{background:#F2F8FF}
  .evc.e-sc{background:#FFF6EC}
  .evc.e-all{background:#F5F3FE}
  .evc.live{box-shadow:0 0 0 2px var(--sun) inset}
  .evt{display:block;font-weight:700;font-size:14.5px;line-height:1.25;color:var(--ink)}
  .evw{display:block;font-size:11.5px;font-weight:700;color:var(--soft);margin-top:2px}
  .evc .nt{display:block;font-size:12px;color:var(--soft);margin-top:5px;line-height:1.35}
  .evc .prac{display:inline-block;margin-top:7px;border:none;font-family:inherit;
    font-size:12.5px;font-weight:800;border-radius:9px;padding:6px 10px;cursor:pointer}
  .evc .x{position:absolute;top:5px;right:5px}
  @media(max-width:560px){
    .agenda{grid-template-columns:44px 1fr 1fr;column-gap:5px}
    .agenda.solo{grid-template-columns:44px 1fr}
    .agd b{font-size:17px}
    .evt{font-size:13px}
    .evc{padding:8px 24px 8px 9px}
  }

  /* ---- progress matrix: each boy gets three subject columns ---- */
  .mxkey{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px;
    color:var(--soft);font-weight:600;margin-bottom:12px}
  .mxkey b{font-weight:700;color:var(--ink)}
  .mx6,.duo{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .kidbox{flex:1 1 300px;min-width:0}
  .kidname{display:block;width:100%;font-family:inherit;border:none;cursor:default;
    font-weight:800;font-size:15px;padding:7px 6px;border-radius:11px;
    text-align:center;margin-bottom:8px}
  button.kidname{cursor:pointer}
  .duo .test{margin-bottom:8px;padding:12px 13px}
  .duo .test .nm{font-size:15px}
  .duo .test .mt{font-size:12px}
  .duo .sub{margin:14px 0 8px}
  .duo .rdsum{margin-bottom:10px}
  .duo .btx{font-size:15px}
  .kidname small{display:block;font-size:10.5px;font-weight:600;opacity:.85}
  .mxcols{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .mxsub{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;
    color:var(--soft);text-align:center;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .mxcol{display:flex;flex-direction:column;gap:6px;padding-top:6px;min-width:0}
  .tbox{border:none;font-family:inherit;text-align:left;width:100%;cursor:pointer;
    border-radius:12px;padding:8px 8px 7px;line-height:1.2;display:block}
  .tbox .tn{display:block;font-size:11.5px;font-weight:700;color:var(--ink);
    white-space:normal;overflow-wrap:anywhere}
  .tbox .tv{display:block;font-size:19px;font-weight:800;margin-top:2px}
  .tbox .td{display:block;font-size:10px;font-weight:600;opacity:.7}
  .tbox.good{background:#DFF3E4;color:#2F7A45}
  .tbox.mid{background:#FFF1D6;color:#8A6100}
  .tbox.low{background:#FFE3DC;color:#B03A22}
  .tbox.none{background:var(--bg);color:var(--soft);border:1.5px solid var(--line)}
  .tbox .tv.small{font-size:13px;font-weight:700}
  .mxtag{font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:800;
    color:var(--soft);margin:8px 0 2px}
  .mxcol > .mxtag:first-child{margin-top:0}
  .mxcols.two{grid-template-columns:repeat(2,1fr)}
  .daily{display:block;width:100%;border:none;font-family:inherit;text-align:left;
    cursor:pointer;border-radius:14px;padding:12px 14px;margin-bottom:9px;color:#fff;
    background:linear-gradient(135deg,#2F73E8,#7C5CE0);box-shadow:0 3px 0 #2559B8}
  .daily .dl{display:block;font-size:16px;font-weight:800}
  .daily .dm{display:block;font-size:12px;font-weight:600;opacity:.9;margin-top:1px}
  .daily:active{transform:translateY(1px);box-shadow:0 2px 0 #2559B8}
  .daily.done{background:linear-gradient(135deg,#4FB86B,#2F7A45);box-shadow:0 3px 0 #276237}
  .mxcols.wide{grid-template-columns:1fr 2.1fr 1fr}
  .zhwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
  .hzgrid{display:grid;grid-template-columns:minmax(52px,auto) 1fr 1fr;gap:6px;
    align-items:stretch}
  .hzh{font-size:10px;letter-spacing:.04em;font-weight:800;color:var(--soft);
    text-align:center;padding-bottom:2px}
  .hzl{font-size:12.5px;font-weight:700;display:flex;flex-direction:column;
    justify-content:center;line-height:1.15}
  .hzl em{font-style:normal;font-size:10px;font-weight:600;color:var(--soft)}
  .hzgrid .tbox{padding:6px}
  .hzgrid .tbox .td{font-size:9.5px}
  .mxcols.one{grid-template-columns:1fr}
  .mxcols.one .mxsub{text-align:left}
  .tbox:active{transform:translateY(1px)}
  .tbox[disabled]{cursor:default}
  .mxnone{color:#C3D2DF;font-size:12px;text-align:center;padding:8px 0;font-weight:600}
  .mxwk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mxwk .wt{margin-top:0}
  .foot{text-align:center;margin-top:16px;color:var(--soft);font-size:12px;line-height:1.7}
  @media(min-width:700px){
    .day{grid-template-columns:80px 1fr}
  }

  /* ==========================================================================
     SCENES — one full-bleed backdrop, picked at the bottom of the screen.
     The cards stay as they are; only the world behind them changes.
     ========================================================================== */
  body{background-attachment:fixed;background-repeat:no-repeat;background-size:cover}

  /* dark worlds: lift the small print off the sky */
  body[data-scene="galaxy"] .foot,
  body[data-scene="lava"] .foot,
  body[data-scene="spirit"] .foot,
  body[data-scene="forest"] .foot{color:rgba(255,255,255,.78)}
  body[data-scene="galaxy"] .mark span,
  body[data-scene="lava"] .mark span,
  body[data-scene="spirit"] .mark span,
  body[data-scene="forest"] .mark span{text-shadow:0 2px 14px rgba(0,0,0,.35)}
  body[data-scene="galaxy"] .panel,
  body[data-scene="lava"] .panel,
  body[data-scene="spirit"] .panel,
  body[data-scene="forest"] .panel{box-shadow:0 10px 34px rgba(0,0,0,.28)}

  /* the picker itself */
  .head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .head .mark{margin-bottom:0;flex:1}
  .scenes{display:flex;gap:7px;flex-wrap:nowrap;flex-shrink:0}
  .sc-pick{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.75);
    cursor:pointer;padding:0;box-shadow:0 2px 7px rgba(16,24,40,.22);transition:transform .12s}
  .sc-pick.on{outline:2.5px solid #fff;outline-offset:2px;transform:scale(1.14)}
  .sc-pick:hover{transform:scale(1.14)}
  .sndbtn{margin-left:6px;width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(255,255,255,.85);font-size:14px;line-height:1;padding:0;
    box-shadow:0 2px 7px rgba(16,24,40,.22)}
  .sndbtn.off{background:rgba(255,255,255,.45);opacity:.7}

  /* ---- who the whole app is showing, sitting under the tabs ---- */
  .whobar{display:flex;gap:9px;margin-bottom:14px}
  .wb{flex:1;min-width:0;border:none;border-radius:16px;padding:11px 10px;
    font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;line-height:1.15;
    transition:transform .1s,box-shadow .1s;display:flex;flex-direction:column;
    align-items:center;justify-content:center}
  .wb small{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:1px}
  .wb:active{transform:translateY(2px)}
  /* resting: a tint of their own colour, so nothing is a plain white slab */
  .wb.all{background:linear-gradient(160deg,#EEF0FB,#E7E3F7);color:#4B4A76;
    box-shadow:inset 0 0 0 1.5px #DCD8F0, 0 3px 0 #DCD8F0}
  .wb.k-tc{background:linear-gradient(160deg,#EAF3FE,#DCEBFD);color:var(--blue);
    box-shadow:inset 0 0 0 1.5px #C9DFF8, 0 3px 0 #C9DFF8}
  .wb.k-sc{background:linear-gradient(160deg,#FFF1E2,#FFE5CE);color:var(--tang);
    box-shadow:inset 0 0 0 1.5px #F5D2AE, 0 3px 0 #F5D2AE}
  /* chosen: filled, with a little lift */
  .wb.on{color:#fff}
  .wb.on{box-shadow:0 0 0 3px #fff, 0 4px 0 rgba(16,24,40,.22)}
  .wb.all.on{background:linear-gradient(150deg,#4C6FE8,#7C5CE0)}
  .wb.k-tc.on{background:linear-gradient(150deg,#2F73E8,#4FA0F5)}
  .wb.k-sc.on{background:linear-gradient(150deg,#E1740F,#FFA23D)}
  .wb.on small{opacity:.9}
  .wb:active.on{box-shadow:0 2px 0 rgba(0,0,0,.3)}
  .sc-sky{background:linear-gradient(160deg,#8CC6F5,#E9F4FE)}
  .sc-forest{background:linear-gradient(160deg,#0D2B23,#2A5A3C)}
  .sc-galaxy{background:linear-gradient(160deg,#141543,#7C5CE0)}
  .sc-lava{background:linear-gradient(160deg,#2C1116,#FF8B3D)}
  .sc-spirit{background:linear-gradient(160deg,#452C6E,#FFC9E4)}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}
    body::before{animation:none}}
</style>
</head>
<body>
<div class="shell">
  <div class="head">
    <button class="mark" id="mark" onclick="go('home')" title="Home"></button>
    <div class="scenes" id="scenes"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="whobar" id="whobar"></div>
  <div id="view"></div>
  <div class="foot">Saved on this device</div>
</div>
<!-- load order matters: data, then core, then screens, app last -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js?v=15"></script>
<script src="core.js?v=23"></script>
<script src="timetable.js?v=5"></script>
<script src="training.js?v=12"></script>
<script src="app.js?v=54"></script>
</body>
</html>
